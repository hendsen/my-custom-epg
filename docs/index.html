<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom IPTV EPG Provider</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      color: #58a6ff;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .url-box {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 16px 0 8px 0;
      font-family: monospace;
      font-size: 0.85rem;
      color: #7ee787;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 8px;
      margin-right: 8px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn-secondary:hover {
      background-color: #30363d;
    }
    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
      color: #484f58;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📺 Custom IPTV EPG</h1>
    <p>Custom EPG renewed everyday.</p>
    
    <label style="font-size: 0.85rem; font-weight: 600; color: #c9d1d9;">Compressed EPG (.gz) — <i>Recommended</i>:</label>
    <div class="url-box" id="url-gz">Loading URL...</div>
    <a href="guide.xml.gz" class="btn">Download .xml.gz</a>
    <button onclick="copyToClipboard('url-gz')" class="btn btn-secondary">Copy Link GZ</button>

    <div style="margin-top: 20px;">
      <label style="font-size: 0.85rem; font-weight: 600; color: #c9d1d9;">URL Plain XML:</label>
      <div class="url-box" id="url-xml">Loading URL...</div>
      <a href="guide.xml" class="btn btn-secondary">Download .xml</a>
      <button onclick="copyToClipboard('url-xml')" class="btn btn-secondary">Copy Link XML</button>
    </div>

    <footer>
      Powered by GitHub 
    </footer>
  </div>

  <script>
    const baseUrl = window.location.href.split('?')[0].replace(/\/$/, "");
    document.getElementById('url-gz').innerText = baseUrl + '/guide.xml.gz';
    document.getElementById('url-xml').innerText = baseUrl + '/guide.xml';

    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('URL berhasil disalin ke clipboard!');
      });
    }
  </script>
</body>
</html>
